name: Build APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: kivy/buildozer:latest
      options: --user root
    steps:
      - name: Fix git permissions
        run: git config --global --add safe.directory '*'

      - uses: actions/checkout@v4

      - name: Generate clean buildozer.spec
        run: |
          cat << 'EOF' > buildozer.spec
          [app]
          title = Arena Shooter
          package.name = arenashooter
          package.domain = org.test
          source.dir = .
          source.include_exts = py,png,jpg,kv,atlas
          version = 0.1
          requirements = python3,kivy==2.3.0
          orientation = portrait
          fullscreen = 0
          android.permissions = INTERNET
          android.api = 33
          android.minapi = 21
          android.ndk = 25b
          android.archs = arm64-v8a
          android.accept_sdk_license = True

          [buildozer]
          log_level = 2
          warn_on_root = 0
          EOF

      - name: Build APK
        run: buildozer -v android debug > build.log 2>&1 || (grep -B 25 "Command failed:" build.log || tail -n 50 build.log; exit 1)

      - name: Upload Error Log if failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: error-log
          path: build.log

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: arena-shooter-apk
          path: bin/*.apk
