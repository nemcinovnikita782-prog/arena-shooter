name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip build-essential git python3 python3-dev ffmpeg libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev libportmidi-dev libswscale-dev libavformat-dev libavcodec-dev zlib1g-dev libgstreamer1.0 gstreamer1.0-plugins-base gstreamer1.0-plugins-good openjdk-17-jdk autoconf automake libtool pkg-config libffi-dev libssl-dev unzip zip
          pip3 install --upgrade buildozer==1.5.0 cython==0.29.36 setuptools wheel

      - name: Build APK
        run: yes | buildozer -v android debug

      - uses: actions/upload-artifact@v4
        with:
          name: arena-shooter-apk
          path: bin/*.apk
