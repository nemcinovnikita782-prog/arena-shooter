name: Build APK
on: [push, workflow_dispatch]

env:
  BUILDOZER_WARN_ON_ROOT: 0
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system packages and Java 11
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip build-essential git python3 python3-dev openjdk-11-jdk autoconf automake libtool pkg-config libffi-dev libssl-dev unzip zip zlib1g-dev libncurses5 libstdc++6
          sudo update-alternatives --set java /usr/lib/jvm/java-11-openjdk-amd64/bin/java

      - name: Setup Android SDK build-tools 33.0.2 (with aidl)
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "build-tools;33.0.2" "platforms;android-33"

      - name: Install Buildozer and pinned Python tools
        run: |
          pip3 install --upgrade pip
          pip3 install buildozer==1.5.0 cython==0.29.36 "setuptools<70.0" wheel

      - name: Configure buildozer.spec safely
        run: |
          sed -i 's/requirements = .*/requirements = python3,kivy==2.3.0/' buildozer.spec
          sed -i 's/android.archs = .*/android.archs = arm64-v8a/' buildozer.spec
          grep -q "android.build_tools" buildozer.spec || echo "android.build_tools = 33.0.2" >> buildozer.spec
          grep -q "android.accept_sdk_license" buildozer.spec || echo "android.accept_sdk_license = True" >> buildozer.spec

      - name: Build APK
        run: |
          buildozer -v android debug > build.log 2>&1 || (tail -n 60 build.log && exit 1)

      - name: Upload Error Log if failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: error-log
          path: build.log

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: arena-shooter-apk
          path: bin/*.apk
