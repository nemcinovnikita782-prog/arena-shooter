name: Build APK
on: [push, workflow_dispatch]

env:
  BUILDOZER_WARN_ON_ROOT: 0
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Cache Buildozer directory
        uses: actions/cache@v4
        with:
          path: |
            .buildozer
            ~/.buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-${{ runner.os }}-

      - name: Install system packages and Java 11
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip build-essential git python3 python3-dev openjdk-11-jdk autoconf automake libtool pkg-config libffi-dev libssl-dev unzip zip zlib1g-dev libncurses5 libstdc++6 libsqlite3-dev
          sudo update-alternatives --set java /usr/lib/jvm/java-11-openjdk-amd64/bin/java

      - name: Setup Android SDK build-tools 33.0.2 and licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "build-tools;33.0.2" "platforms;android-33"

      - name: Install Buildozer and pinned Python tools
        run: |
          pip3 install --upgrade pip
          pip3 install buildozer==1.5.0 cython==0.29.36 "setuptools<70.0" wheel

      - name: Generate clean buildozer.spec
        run: |
          cat << 'EOF' > buildozer.spec
          [app]
          title = Arena Shooter
          package.name = arenashooter
          package.domain = org.test
          source.dir = .
          source.include_exts = py,png,jpg,kv,atlas
          version = 0.1
          requirements = python3==3.11.5,kivy==2.3.0
          orientation = portrait
          fullscreen = 0
          android.permissions = INTERNET
          android.api = 33
          android.minapi = 21
          android.ndk = 25b
          android.build_tools = 33.0.2
          android.archs = arm64-v8a
          android.accept_sdk_license = True
          p4a.branch = release-2024.01.21

          [buildozer]
          log_level = 2
          warn_on_root = 0
          EOF

      - name: Build APK
        run: |
          yes | buildozer -v android debug > build.log 2>&1 || (grep -B 25 "Command failed:" build.log || tail -n 50 build.log; exit 1)

      - name: Upload Error Log if failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: error-log
          path: build.log

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: arena-shooter-apk
          path: bin/*.apk
