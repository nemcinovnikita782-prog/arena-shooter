name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip build-essential git python3 python3-dev openjdk-11-jdk autoconf automake libtool pkg-config libffi-dev libssl-dev unzip zip zlib1g-dev
          sudo update-alternatives --set java /usr/lib/jvm/java-11-openjdk-amd64/bin/java
          pip3 install --upgrade buildozer==1.5.0 cython==0.29.36 setuptools wheel

      - name: Build APK
        run: |
          yes | buildozer -v android debug > build.log 2>&1 || (grep -i -E "error:|failed|exception" build.log | tail -n 25 && exit 1)

      - uses: actions/upload-artifact@v4
        with:
          name: arena-shooter-apk
          path: bin/*.apk
